[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  CI = "false"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/speech"
  to = "/.netlify/functions/speech"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/wheather"
  to = "/weather"
  status = 301

[[redirects]]
  from = "/invata-limba"
  to = "/invata"
  status = 301

[[redirects]]
  from = "/descopera/ghid/*"
  to = "/viata-in-norvegia/ghid/:splat"
  status = 301

[[redirects]]
  from = "/invata"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/exerseaza"
  to = "/index.html"
  status = 200

